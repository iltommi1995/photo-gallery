# Local development database only. Full-stack deploy (app + db + reverse
# proxy) is docker-compose.yml — see docs/deployment.md.
#
# Explicit project name: without it, Compose infers the project name from
# the directory ("photo-gallery"), colliding with docker-compose.yml's
# pinned `name: photo-gallery` — running a `docker compose` command against
# one file while the other's containers exist can then treat them as the
# same project and recreate/remove them into each other's shape.
name: photo-gallery-dev

services:
  db:
    image: postgres:17-alpine
    container_name: photo-gallery-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: photogallery
      POSTGRES_PASSWORD: photogallery
      POSTGRES_DB: photogallery
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - photo-gallery-dev-db-data:/var/lib/postgresql/data

volumes:
  photo-gallery-dev-db-data:
    # Pinned to the volume's actual existing name (created before this file
    # had an explicit project `name:`, back when it was inferred from the
    # directory) so this change doesn't orphan real seeded/dev data.
    name: photo-gallery_photo-gallery-dev-db-data
