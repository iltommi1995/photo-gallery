name: Deploy

# Push to main: verify the code (GitHub-hosted runner, fast, no homelab
# access needed), then — only if that passes — build and deploy on the
# self-hosted runner that lives on the target host itself. That runner
# polls GitHub outbound; nothing needs to be reachable from the internet
# for this to work. See docs/deployment.md for the one-time host setup
# (Docker, this runner, the .env file the deploy job expects to find
# already in place) and for the manual equivalent of the deploy steps
# below, if you ever need to run them by hand.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  deploy:
    needs: verify
    # Only an actual push to main deploys — a pull_request run (checks
    # shown on the PR before merge) stops after verify.
    if: github.event_name != 'pull_request'
    # Just `self-hosted`, not `[self-hosted, photo-gallery]` — the runner
    # registered for this repo never actually got the "photo-gallery"
    # custom label applied (its --labels flag didn't stick), discovered
    # live when every deploy sat "Waiting for a runner to pick up this
    # job..." forever. There's only one self-hosted runner on this repo,
    # so requiring a custom label added nothing anyway.
    runs-on: self-hosted
    # A previous run's next build can still be starting up when a second
    # push lands seconds later — let one deploy finish before the next
    # starts, rather than two `docker compose build app`s racing on the
    # same working directory.
    concurrency:
      group: photo-gallery-deploy
      cancel-in-progress: false
    steps:
      # clean: false — checkout's default `git clean -ffdx` wipes untracked
      # files, including the gitignored .env this job depends on, before
      # every single run. Discovered live: copying .env into the runner's
      # workspace once did NOT survive to the next run for exactly this
      # reason. With clean disabled, .env (created once by hand, see the
      # step below) persists across deploys same as it would on any other
      # persistent server.
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Check .env exists
        run: |
          if [ ! -f .env ]; then
            echo "::error::.env is missing from the runner's working directory ($(pwd))."
            echo "::error::It's gitignored on purpose — create it once by hand per docs/deployment.md, it isn't part of this checkout."
            exit 1
          fi

      - name: Start db and wait for it to be healthy
        run: |
          docker compose up -d db
          for i in $(seq 1 30); do
            if docker compose ps db | grep -q healthy; then
              echo "db is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::db did not become healthy in time"
          docker compose logs db
          exit 1

      - name: Run migrations
        run: |
          docker build --target migrator -t photo-gallery-migrator .
          docker run --rm --network photo-gallery-net --env-file .env \
            photo-gallery-migrator

      # `docker compose build app` — not used here — silently drops the
      # `network: host` build option's actual effect: BuildKit gates
      # host-network access for RUN steps behind a separate per-build
      # "network.host" entitlement, and going through `docker compose
      # build` (→ `docker buildx bake` under the hood) doesn't request
      # it, even with `network: host` set in docker-compose.yml — the
      # build just silently falls back to an isolated network with no
      # route to `db`, discovered live (`Can't reach database server at
      # db:5432` from inside `RUN pnpm build`, despite `db` being up,
      # healthy, and reachable via a plain `docker run --network
      # photo-gallery-net`, and the buildx builder itself correctly
      # attached to that network — none of that matters if the
      # entitlement was never granted for this specific build).
      # `docker buildx build --allow network.host` grants it explicitly,
      # confirmed live to actually reach `db`. `--load` (not `--push`)
      # puts the result straight into the local Docker daemon, tagged to
      # match what `docker compose up -d app` expects, which then starts
      # it without rebuilding.
      - name: Build and deploy app
        run: |
          set -a
          source .env
          set +a
          docker buildx build \
            --network host --allow network.host \
            --build-arg DATABASE_URL="${DATABASE_URL}" \
            --build-arg NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL}" \
            --load -t photo-gallery-app:latest .
          docker compose up -d app

      - name: Wait for the app to respond
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3000/ -o /dev/null; then
              echo "app is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::app did not respond in time after deploy"
          docker compose logs app
          exit 1

      - name: Clean up dangling images
        if: always()
        run: docker image prune -f
