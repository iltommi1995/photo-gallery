# Production stack: app + Postgres. TLS/routing is handled externally by
# a reverse proxy that already exists in front of this deployment (e.g.
# Nginx Proxy Manager, proxying a domain to this host's `app:3000`) — see
# docs/deployment.md for the full first-boot/update/backup walkthrough, in
# particular why `db` must be started (and healthy) *before* building
# `app`. If you don't already have a reverse proxy fronting your other
# self-hosted services, docs/deployment.md also covers that.
name: photo-gallery

networks:
  photo-gallery-net:
    name: photo-gallery-net

volumes:
  db-data:
  photo-storage:

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-photogallery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-photogallery}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - photo-gallery-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-photogallery}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      # NOT `network: photo-gallery-net` — BuildKit's compose/bake config
      # only accepts `default`/`none`/`host` for this field (a named bridge
      # network is rejected outright, discovered live during deployment).
      # `host` here does NOT mean the real Docker host's network — it means
      # "whatever network the active buildx builder's own container is on",
      # which is `photo-gallery-net` for the network-attached builder this
      # stack requires (`docker buildx create --driver docker-container
      # --driver-opt network=photo-gallery-net --use`, one-time, documented
      # in docs/deployment.md) — that's what actually lets the build reach
      # `db` (see the Dockerfile builder-stage comment for why it needs to).
      #
      # This field alone is NOT sufficient, though, and nothing here
      # actually depends on it anymore: `docker compose build` (→ `docker
      # buildx bake`) never grants BuildKit's separate per-build
      # `network.host` entitlement that using host networking in a RUN
      # step actually requires, `network: host` here or not — discovered
      # live, kept only as documentation/for anyone who still reaches for
      # `docker compose build app` out of habit. Every documented deploy
      # path (`.github/workflows/deploy.yml`, docs/deployment.md) uses
      # `docker buildx build --network host --allow network.host`
      # directly instead, which does grant it.
      network: host
      args:
        DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
      # Auth.js's own recommended fix for self-hosted deployments behind a
      # reverse proxy: an explicit canonical URL is more robust than relying
      # on trustHost's forwarded-header detection alone, which depends on
      # exactly how the proxy forwards Host/X-Forwarded-* — discovered live
      # when sign-out redirected to https://localhost:3000 in production.
      # Reuses NEXT_PUBLIC_SITE_URL rather than a second env var to set.
      AUTH_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
      STORAGE_DIR: /app/storage
    volumes:
      - photo-storage:/app/storage
    # Bound directly to the host so an external reverse proxy (running
    # elsewhere on the LAN, e.g. Nginx Proxy Manager in its own
    # container) can reach it at <this-host-ip>:3000 — see
    # docs/deployment.md.
    ports:
      - "3000:3000"
    networks:
      - photo-gallery-net
    depends_on:
      db:
        condition: service_healthy
