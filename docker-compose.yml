# Production stack: app + Postgres. TLS/routing is handled externally by
# a reverse proxy that already exists in front of this deployment (e.g.
# Nginx Proxy Manager, proxying a domain to this host's `app:3000`) — see
# docs/deployment.md for the full first-boot/update/backup walkthrough, in
# particular why `db` must be started (and healthy) *before* building
# `app`. If you don't already have a reverse proxy fronting your other
# self-hosted services, docs/deployment.md also covers that.
name: photo-gallery

networks:
  photo-gallery-net:
    name: photo-gallery-net

volumes:
  db-data:
  photo-storage:

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-photogallery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-photogallery}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - photo-gallery-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-photogallery}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      # NOT `network: photo-gallery-net` here — BuildKit's compose/bake
      # config only accepts `default`/`none`/`host` for this field (a named
      # bridge network is rejected outright, discovered live during
      # deployment). The build still needs to reach `db` (see the Dockerfile
      # builder-stage comment), which instead requires the active buildx
      # builder itself to be attached to `photo-gallery-net` — a one-time
      # `docker buildx create --driver docker-container --driver-opt
      # network=photo-gallery-net --use`, documented in docs/deployment.md.
      args:
        DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
      STORAGE_DIR: /app/storage
    volumes:
      - photo-storage:/app/storage
    # Bound directly to the host so an external reverse proxy (running
    # elsewhere on the LAN, e.g. Nginx Proxy Manager in its own
    # container) can reach it at <this-host-ip>:3000 — see
    # docs/deployment.md.
    ports:
      - "3000:3000"
    networks:
      - photo-gallery-net
    depends_on:
      db:
        condition: service_healthy
